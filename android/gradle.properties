# Mémoire de Gradle limitée à 2 Go (avant : 8 Go + 4 Go de metaspace,
# trop pour le PC → mémoire saturée, disque qui swappe, build bloqué).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Le compilateur Kotlin tourne DANS Gradle au lieu de lancer son propre
# processus Java (c'était l'un des gros consommateurs de mémoire).
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true