name: groshop
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  go_router: ^17.5.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  google_mobile_ads: ^7.0.0
  palette_generator: ^0.3.3+3
  shared_preferences: ^2.5.5
  http: ^1.6.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.3.0
  image_picker: ^1.1.2
  google_sign_in: ^6.2.1
  flutter_web_auth_2: ^4.0.0
  video_player: ^2.11.1
  lottie: ^3.6.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  connectivity_plus: ^7.3.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # iOS : utiliser CocoaPods au lieu de Swift Package Manager
  # (corrige l'erreur "Xcode failed to resolve Swift Package Manager dependencies")
  config:
    enable-swift-package-manager: false

  assets:
    - assets/images/
    - assets/tunisia_regions.json
    - assets/lottie/trophy.json
    - assets/lottie/searchicon.json
    - assets/lottie/sell.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"